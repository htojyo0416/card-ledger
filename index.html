<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Card Ledger" />
    <title>Card Ledger</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">CL</div>
          <div>
            <h1>Card Ledger</h1>
            <p>名刺を読み取り、整理する</p>
          </div>
        </div>

        <label class="search">
          <span>検索</span>
          <input id="searchInput" type="search" placeholder="名前・会社・メール" autocomplete="off" />
        </label>

        <div class="stat-grid" aria-label="保存状況">
          <div>
            <strong id="totalCount">0</strong>
            <span>保存済み</span>
          </div>
          <div>
            <strong id="recentCount">0</strong>
            <span>今週追加</span>
          </div>
        </div>

        <div class="list-header">
          <span>名刺一覧</span>
          <button id="newCardButton" class="icon-button" type="button" title="新規作成" aria-label="新規作成">+</button>
        </div>
        <div id="cardList" class="card-list" aria-live="polite"></div>
      </aside>

      <main class="workspace">
        <section class="capture-panel">
          <div class="panel-title">
            <div>
              <h2>読み取り</h2>
              <p>写真を撮るか、画像をアップロードしてください。</p>
            </div>
            <div class="segmented" role="tablist" aria-label="入力方法">
              <button id="cameraTab" class="active" type="button">カメラ</button>
              <button id="uploadTab" type="button">画像</button>
            </div>
          </div>

          <div id="cameraPane" class="input-pane active">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div class="capture-actions">
              <button id="startCameraButton" class="secondary" type="button">カメラ起動</button>
              <button id="captureButton" class="primary" type="button" disabled>撮影して解析</button>
            </div>
          </div>

          <div id="uploadPane" class="input-pane">
            <label class="drop-zone" for="imageInput">
              <input id="imageInput" type="file" accept="image/*" />
              <span>画像を選択</span>
              <small>JPG / PNG / HEIC対応ブラウザではHEICも可</small>
            </label>
          </div>

          <canvas id="snapshotCanvas" hidden></canvas>
          <div class="preview-row">
            <img id="businessCardImage" alt="名刺プレビュー" />
            <div class="ocr-box">
              <div class="ocr-status">
                <span id="ocrState">画像待ち</span>
                <span id="ocrProgress"></span>
              </div>
              <textarea id="rawText" placeholder="OCR結果、または手入力したテキストがここに入ります"></textarea>
              <button id="parseButton" class="secondary" type="button">テキストから再抽出</button>
            </div>
          </div>
        </section>

        <section class="detail-panel">
          <div class="panel-title">
            <div>
              <h2>名刺情報</h2>
              <p>抽出結果を確認して保存します。</p>
            </div>
            <div class="detail-actions">
              <button id="deleteButton" class="danger" type="button">削除</button>
              <button id="saveButton" class="primary" type="button">保存</button>
            </div>
          </div>

          <form id="cardForm" class="form-grid">
            <label>
              氏名
              <input id="name" name="name" autocomplete="name" />
            </label>
            <label>
              会社
              <input id="company" name="company" autocomplete="organization" />
            </label>
            <label>
              役職
              <input id="title" name="title" autocomplete="organization-title" />
            </label>
            <label>
              メール
              <input id="email" name="email" type="email" autocomplete="email" />
            </label>
            <label>
              電話
              <input id="phone" name="phone" autocomplete="tel" />
            </label>
            <label>
              Web
              <input id="website" name="website" autocomplete="url" />
            </label>
            <label class="full">
              住所
              <input id="address" name="address" autocomplete="street-address" />
            </label>
            <label class="full">
              メモ
              <textarea id="notes" name="notes" placeholder="商談メモ、紹介者、次のアクションなど"></textarea>
            </label>
          </form>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
